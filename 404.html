<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>페이지를 찾을 수 없습니다 · Winning Basic!</title>
<link rel="icon" href="/winning-basic/icon.svg" type="image/svg+xml">
<style>
:root{--ink:#1C1917;--accent:#00807F;--text-2:#57534D;--bg:#FAFAF9;--surface:#FFFFFF;--border:#DEE5E5;--btn-bg:#1C1917;--btn-fg:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#F5F5F4;--accent:#5ED6D6;--text-2:#CAC5BF;--bg:#141211;--surface:#1D1B19;--border:#33302D;--btn-bg:#F5F5F4;--btn-fg:#1C1917;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:480px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 28px}
p.l{margin:0;color:var(--accent);font-weight:600;font-size:14px}
h1{margin:10px 0 8px;font-size:26px;letter-spacing:-.02em;text-wrap:balance}
p{color:var(--text-2);line-height:1.6;margin:0 0 24px}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:99px;background:var(--btn-bg);color:var(--btn-fg);text-decoration:none;font-weight:600}
a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="l">Winning Basic!</p>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 잘못 입력되었습니다. 캠페인 홈에서 다시 시작하세요.</p>
  <a class="btn" href="/winning-basic/">캠페인 홈으로</a>
</main>
</body>
</html>
