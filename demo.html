<title>Winning Basic!</title>
<meta name="description" content="'27년 MVC 가치체계 내재화 캠페인 Winning Basic! — 캠페인 안내, 실천·결과물 제출, Survey, 4주 운영 대시보드">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Layout: 1160px 단일 컬럼, 오프화이트 바탕 위 1px 보더 카드, Teal은 부제·수치·상태에만, 행동(버튼)은 Ink */
:root{
  --ink:#1C1917; --accent:#00A7A7; --accent-strong:#00807F; --accent-tint:#00A7A714;
  --text-2:#57534D; --text-3:#79716B; --subtle:#EFEEED; --bg:#FAFAF9; --surface:#FFFFFF;
  --border:#DEE5E5; --border-2:#E7E5E4; --link:#0077CC;
  --btn-bg:#1C1917; --btn-fg:#FFFFFF; --overlay:#FAFAF9E6;
  --ok:#00806B; --ok-tint:#00987E14; --warn:#9A5B00; --warn-tint:#C8860014; --bad:#B4111B; --bad-tint:#D3111D12;
  --shadow:0 1px 2px 0 rgba(0,0,0,.1);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --r-pill:99px; --r-card:16px; --r-md:8px; --r-sm:4px;
  --z-header:10; --z-toast:20;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#F5F5F4; --accent:#2CC4C4; --accent-strong:#5ED6D6; --accent-tint:#2CC4C41F;
  --text-2:#CAC5BF; --text-3:#A29C95; --subtle:#2B2826; --bg:#141211; --surface:#1D1B19;
  --border:#33302D; --border-2:#3A3633; --link:#5AB8FF;
  --btn-bg:#F5F5F4; --btn-fg:#1C1917; --overlay:#141211E6;
  --ok:#3FCFAE; --ok-tint:#3FCFAE1A; --warn:#E8B04A; --warn-tint:#E8B04A1A; --bad:#FF6B6B; --bad-tint:#FF6B6B1A;
  --shadow:0 1px 2px 0 rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#F5F5F4; --accent:#2CC4C4; --accent-strong:#5ED6D6; --accent-tint:#2CC4C41F;
  --text-2:#CAC5BF; --text-3:#A29C95; --subtle:#2B2826; --bg:#141211; --surface:#1D1B19;
  --border:#33302D; --border-2:#3A3633; --link:#5AB8FF;
  --btn-bg:#F5F5F4; --btn-fg:#1C1917; --overlay:#141211E6;
  --ok:#3FCFAE; --ok-tint:#3FCFAE1A; --warn:#E8B04A; --warn-tint:#E8B04A1A; --bad:#FF6B6B; --bad-tint:#FF6B6B1A;
  --shadow:0 1px 2px 0 rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;font-weight:500;line-height:1.65;word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3,h4,h5{margin:0;font-weight:700;letter-spacing:-0.02em;line-height:1.22;text-wrap:balance}
p{margin:0;text-wrap:pretty}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px;border-radius:var(--r-sm)}
main[tabindex="-1"]:focus{outline:none}
.num,table,.kpi-v{font-variant-numeric:tabular-nums}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
.skip{position:absolute;left:-9999px}.skip:focus{left:16px;top:16px;z-index:var(--z-toast);background:var(--surface);padding:8px 12px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:var(--z-header);background:var(--overlay);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--subtle)}
.hdr-in{display:flex;align-items:center;gap:16px;min-height:60px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;flex-shrink:0}
.brand b{font-size:18px;letter-spacing:-0.02em}
.brand span{font-size:12px;color:var(--text-3);font-weight:600}
.nav{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:7px 12px;border-radius:var(--r-pill);text-decoration:none;font-size:14px;font-weight:600;color:var(--text-2);white-space:nowrap}
.nav a:hover{background:var(--subtle);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--subtle);color:var(--ink)}
.theme-btn{gap:6px;color:var(--text-2)}
.theme-btn svg{width:16px;height:16px;flex-shrink:0}
@media (max-width:640px){.theme-btn .t-label{display:none}.hdr-in{flex-wrap:wrap;gap:4px 8px;padding-block:8px}.brand{margin-right:auto}.nav{order:3;flex-basis:100%;margin-inline:-8px}}
.acct{display:flex;align-items:center;gap:4px;flex-shrink:0;font-size:14px;font-weight:700}
.acct-name{white-space:nowrap}
@media (max-width:640px){.acct-name .cap{display:none}}
.demo-bar{background:var(--warn-tint);border-bottom:1px solid var(--border-2);font-size:13px;color:var(--text-2)}
.demo-bar .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-block:8px}
.demo-bar strong{color:var(--warn)}
.demo-bar label{display:flex;gap:6px;align-items:center}
.demo-bar input{padding:2px 6px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--surface)}

main{padding-block:40px 96px;min-height:60vh}
.stack{display:flex;flex-direction:column;gap:24px}
.sec{display:flex;flex-direction:column;gap:20px;margin-top:72px}
.sec-h{display:flex;flex-direction:column;gap:6px}
.h1{font-size:44px}
.h2{font-size:30px}
.h3t{font-size:18px;color:var(--accent-strong);font-weight:700;letter-spacing:-0.02em}
.label{font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--accent-strong);text-transform:uppercase}
.muted{color:var(--text-2)}
.cap{font-size:13px;color:var(--text-3)}
.micro{font-size:12px;color:var(--text-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 20px;border-radius:var(--r-pill);border:0;font-weight:700;font-size:15px;letter-spacing:-0.03em;text-decoration:none;cursor:pointer;background:var(--btn-bg);color:var(--btn-fg);white-space:nowrap}
.btn:hover{opacity:.88}
.btn.sec2{background:var(--subtle);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);border:1px solid var(--text-3)}
.btn.ghost{background:transparent;color:var(--ink);padding:0 8px;min-height:36px}
.btn.sm{min-height:34px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lnk{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:1px solid var(--border)}
.lnk:hover{border-color:var(--ink)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow);padding:24px;min-width:0}
.card.pad-lg{padding:32px 40px}
.well{background:var(--subtle);border-radius:var(--r-md);padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:var(--subtle);color:var(--text-2);white-space:nowrap}
.chip.acc{background:var(--accent-tint);color:var(--accent-strong)}
.chip.ok{background:var(--ok-tint);color:var(--ok)}
.chip.warn{background:var(--warn-tint);color:var(--warn)}
.chip.bad{background:var(--bad-tint);color:var(--bad)}
.chip.dash{background:transparent;border:1px dashed var(--accent);color:var(--ink)}
.chip.line{background:transparent;border:1px solid var(--border);color:var(--text-2)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:start}
.hero .display{font-size:64px;line-height:1.08;letter-spacing:-0.03em}
.hero .lead{font-size:20px;color:var(--accent-strong);font-weight:700;letter-spacing:-0.02em;line-height:1.45}
.now{display:flex;flex-direction:column;gap:16px}
.now .slogan{font-size:28px;line-height:1.3}
.big-no{font-size:44px;font-weight:700;letter-spacing:-0.04em;color:var(--accent-strong);line-height:1}

/* process */
.proc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;list-style:none;margin:0;padding:0}
.proc>li{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:8px;min-width:0}
.proc>li.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.proc .step{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:var(--r-sm);background:var(--ink);color:var(--bg);font-size:13px;font-weight:700}
.proc h4{font-size:17px}
.proc ul{margin:0;padding-left:18px;color:var(--text-2);font-size:14px}
.proc .when{margin-top:auto;padding-top:8px;font-size:13px;font-weight:700;color:var(--accent-strong)}

/* quarter */
.q-card{display:flex;flex-direction:column;gap:12px}
.q-card h3{font-size:22px}
.q-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--subtle)}
.q-list li a{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--subtle);text-decoration:none;font-weight:600}
.q-list li a:hover .t{text-decoration:underline}
.q-list .n{font-size:13px;color:var(--text-3);width:22px;flex-shrink:0}
.q-list .t{flex:1;min-width:0}

/* campaign detail */
.c-head{display:flex;flex-direction:column;gap:14px;padding:36px 40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card)}
.c-head .slogan{font-size:40px;letter-spacing:-0.03em}
.c-head .no{font-size:56px;font-weight:700;color:var(--accent-strong);letter-spacing:-0.04em;line-height:1}
.agenda{font-size:20px;font-weight:700;letter-spacing:-0.02em;line-height:1.45}
.acts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.acts li{display:flex;gap:12px;align-items:flex-start}
.acts .i{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--accent-tint);color:var(--accent-strong);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.story{font-size:15px;color:var(--text-2);line-height:1.8}
.msg{font-size:17px;line-height:1.75}
.msg strong{color:var(--ink);box-shadow:inset 0 -0.45em 0 var(--accent-tint)}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* timeline table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--subtle);vertical-align:middle;white-space:nowrap}
td.wrap-t{white-space:normal;min-width:220px}
th{font-size:12px;font-weight:700;color:var(--text-3);background:var(--bg)}
tr:last-child td{border-bottom:0}
tr.cur td{background:var(--accent-tint)}
td.r,th.r{text-align:right}

/* forms */
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field legend,.flabel{font-size:14px;font-weight:700}
.field .help{font-size:13px;color:var(--text-3)}
.field .err{font-size:13px;color:var(--bad);font-weight:600}
.field .err:empty{display:none}
.req{color:var(--bad);margin-left:2px}
input[type=text],input[type=url],input[type=password],input[type=date],select,textarea{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);font-size:15px;font-weight:500}
textarea{min-height:96px;resize:vertical;line-height:1.6}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--bad)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);cursor:pointer}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent-strong);flex-shrink:0}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface);cursor:pointer;text-align:center;font-size:12px;color:var(--text-2);line-height:1.3}
.scale label b{font-size:18px;color:var(--ink)}
.scale input{position:absolute;opacity:0;width:1px;height:1px}
.scale label:has(input:checked){border-color:var(--ink);background:var(--ink);color:var(--bg)}
.scale label:has(input:checked) b{color:var(--bg)}
.scale label:has(input:focus-visible){outline:2px solid var(--accent-strong);outline-offset:2px}
.status{font-size:14px;font-weight:600;min-height:1.4em}
.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}

/* kpi & bars */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi-l{font-size:13px;color:var(--text-3);font-weight:600}
.kpi-v{font-size:30px;font-weight:600;letter-spacing:-0.04em;color:var(--accent-strong);line-height:1.1}
.kpi-v small{font-size:15px;color:var(--text-3);font-weight:600;letter-spacing:0;margin-left:2px}
.kpi-s{font-size:12px;color:var(--text-3)}
.bar{position:relative;height:8px;border-radius:var(--r-pill);background:var(--subtle);min-width:80px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:var(--r-pill)}
.barcell{display:flex;align-items:center;gap:10px;min-width:160px}
.barcell .bar{flex:1}

/* ops */
.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stage{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);cursor:pointer;min-width:0}
.stage[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset}
.stage .s-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stage b{font-size:16px}
.stage .d{font-size:13px;color:var(--text-3);font-weight:600}
.panel{display:flex;flex-direction:column;gap:20px}
.copybox{display:flex;flex-direction:column;gap:8px}
.copybox textarea{min-height:200px;font-size:14px;background:var(--bg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--subtle);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;font-size:14px;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* story card (export) */
.storycard{width:100%;max-width:520px;aspect-ratio:4/5;background:#FAFAF9;color:#1C1917;border:1px solid #DEE5E5;border-radius:16px;padding:36px 32px;display:flex;flex-direction:column;gap:18px;font-family:var(--font)}
.storycard .sc-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:#79716B}
.storycard .sc-no{font-size:72px;font-weight:700;letter-spacing:-0.04em;color:#00807F;line-height:1}
.storycard .sc-slogan{font-size:30px;font-weight:700;letter-spacing:-0.03em;line-height:1.28}
.storycard .sc-rule{font-size:15px;font-weight:700;color:#00807F}
.storycard .sc-acts{margin:0;padding-left:18px;font-size:14px;color:#57534D;display:flex;flex-direction:column;gap:6px}
.storycard .sc-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;font-weight:700;border-top:1px solid #E7E5E4;padding-top:14px}
.storycard .sc-brand{color:#00A7A7;font-size:20px}
.storycard .sc-org{font-size:12px;color:#79716B;font-weight:600}

/* gallery */
.case{display:flex;flex-direction:column;gap:10px}
.case dl{margin:0;display:flex;flex-direction:column;gap:8px}
.case dt{font-size:12px;font-weight:700;color:var(--text-3)}
.case dd{margin:0;font-size:15px}
.skel{background:var(--subtle);border-radius:var(--r-md);height:120px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:32px;border:1px dashed var(--border);border-radius:var(--r-card)}

/* dialog */
dialog{border:1px solid var(--border);border-radius:var(--r-card);padding:28px;max-width:440px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(28,25,23,.4)}
dialog h2{font-size:20px;margin-bottom:8px}
dialog .btns{margin-top:20px;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:var(--z-toast);background:var(--btn-bg);color:var(--btn-fg);padding:12px 20px;border-radius:var(--r-pill);font-weight:700;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
footer{border-top:1px solid var(--subtle);padding-block:28px;color:var(--text-3);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

@media (max-width:1199px){.hero .display{font-size:52px}.h1{font-size:36px}.c-head .slogan{font-size:32px}}
@media (max-width:900px){
  .hero{grid-template-columns:1fr;gap:28px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
  .proc,.stages{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  main{padding-block:28px 64px}
  .hero .display{font-size:42px}.h1{font-size:29px}.h2{font-size:24px}
  .c-head{padding:24px 20px}.c-head .slogan{font-size:25px}.c-head .no{font-size:44px}
  .card.pad-lg{padding:24px 20px}
  .g2,.g4{grid-template-columns:1fr}
  .proc,.stages{grid-template-columns:1fr}
  .sec{margin-top:56px}
  .scale label span{display:none}
  .brand span{display:none}
  .now .slogan{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>(function(){try{var t=JSON.parse(localStorage.getItem('wb_theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>

      <a href="#home" data-nav="home">홈</a>

      <a href="#survey" data-nav="survey">Survey</a>
      <a href="#cases" data-nav="cases">사례</a>
      <a href="#guide" data-nav="guide">운영 안내</a>
      <a href="#admin" data-nav="admin" id="navAdmin" hidden>운영자</a>

function buildSchedule(startStr, skipWeeks){
  let d = D(startStr); while(d.getDay()!==1) d = addD(d,1);
  const skip = new Set((skipWeeks||[]).map(s=>{ let x=D(s); while(x.getDay()!==1) x=addD(x,-1); return fmt(x); }));
  return CAMPAIGNS.map(c=>{
    const weeks=[]; let guard=0;
    while(weeks.length<4 && guard++<60){ if(!skip.has(fmt(d))) weeks.push(d); d=addD(d,7); }
    const s1=weeks[0], s2=addD(weeks[0],1), runFrom=addD(weeks[0],2), fri4=addD(weeks[3],4);
    return {no:c.no, weeks, start:s1, end:addD(weeks[3],6), fri4,
      stages:[{k:1,from:s1,to:s1},{k:2,from:s2,to:s2},{k:3,from:runFrom,to:fri4},{k:4,from:fri4,to:addD(fri4,SURVEY_DAYS-1)}],
      surveyFrom:fri4, surveyTo:addD(fri4,SURVEY_DAYS-1)};
  });
}
function today(){ const t = state.demoToday ? D(state.demoToday) : new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function nowInfo(){
  const t=today(), sch=state.schedule;
  if(!sch.length) return {phase:'none'};
  if(t<sch[0].start) return {phase:'before', next:sch[0], days:Math.round((sch[0].start-t)/864e5)};
  const cur = sch.find(s=>t>=s.start && t<=s.end);
  if(!cur){
    if(t>sch[12].end) return {phase:'after'};
    const next = sch.find(s=>s.start>t); return {phase:'gap', next, days:Math.round((next.start-t)/864e5)};
  }
  let week=0; cur.weeks.forEach((w,i)=>{ if(t>=w && t<=addD(w,6)) week=i+1; });
  let stage = 3;
  if(+t===+cur.stages[0].from) stage=1; else if(+t===+cur.stages[1].from) stage=2; else if(t>=cur.fri4) stage=4;
  return {phase:'run', cur, week, stage};
}
function surveyOpenFor(){
  const t=today();
  if(state.demo) { const n=nowInfo(); if(n.phase==='run') return state.schedule[n.cur.no-1]; }
  return state.schedule.find(s=>t>=s.surveyFrom && t<=s.surveyTo) || null;
}
function activeCampaign(){ const n=nowInfo(); return n.phase==='run' ? CAMPAIGNS[n.cur.no-1] : null; }
function statusOf(no){
  const s=state.schedule[no-1], t=today();
  if(!s) return 'plan';
  if(t>s.end) return 'done'; if(t>=s.start) return 'run'; return 'plan';
}

  // 데모 운영자 계정은 비밀번호를 미리 바꿔 둔 상태로 시작합니다.
  [hq,hr,lead].forEach(p=>db.accounts[p.company+'|'+p.empno]={pw:DEMO_PW,v:1,fails:0,lockUntil:0});
  const ts=d=>fmt(d)+' 10:00';
  const SAMPLE={1:[['엘리베이터에서 처음 보는 B사 분께 먼저 인사했더니, 다음 주 협업 회의에서 그분이 먼저 알아봐 주셔서 첫 회의가 훨씬 편했습니다.'],['아침마다 먼저 인사하는 팀장님 덕분에 팀 분위기가 밝아졌습니다. 저도 옆 팀에 먼저 인사하기 시작했어요.'],['스마트폰을 내려놓고 눈을 보고 인사했더니 짧은 대화로 이어졌고, 그 자리에서 업무 질문 하나가 풀렸습니다.']],
    2:[['주간회의에서 일정 리스크를 그 자리에서 말했습니다.','납기를 1주 앞당기는 대신 범위를 나누는 방향으로 결론이 바뀌었습니다.'],['회의 마지막 1분 질문에서 고객 클레임 가능성을 꺼냈습니다.','공지 문구를 사전에 수정해 문의가 줄었습니다.']]};
  const REASONS=['회의 끝 1분 질문을 팀에 처음 제안했습니다.','모르는 동료에게도 늘 먼저 인사합니다.','반대 의견을 회의 자리에서 근거와 함께 말해 결정을 더 좋게 만들었습니다.'];
  const sch=buildSchedule(db.settings.startDate, db.settings.skipWeeks);
  const who=r=>({company:r.company,team:r.team,empno:r.empno,name:r.name});
  [[1,.74,.34,.62],[2,.41,.13,0]].forEach(([no,pr,sr,sv])=>{
    const s=sch[no-1], c=CAMPAIGNS[no-1];
    roster.forEach(r=>{
      if(rnd()<pr){ const checks=c.actions.map((_,i)=>i).filter(()=>rnd()<.65); db.practice.push({ts:ts(addD(s.start,3+Math.floor(rnd()*8))),campaign:no,...who(r),checks:(checks.length?checks:[0]).join(','),note:''}); }
      if(rnd()<sr){ const f=pick(SAMPLE[no]); const fields={}; c.submit.forEach((l,i)=>fields[l]=f[i]||f[0]); db.submissions.push({ts:ts(addD(s.start,5+Math.floor(rnd()*10))),campaign:no,...who(r),fields:JSON.stringify(fields),link:'',public:rnd()<.7}); }
      if(rnd()<sv){
        const base = r.company==='데모 C사'?3.1:r.company==='데모 B사'?3.6:3.9;
        const sc=()=>Math.max(1,Math.min(5,Math.round(base+(rnd()-.4)*2.2)));
        db.surveyPart.push({ts:ts(s.fri4),campaign:no,...who(r)});
        db.surveyResp.push({ts:fmt(s.fri4),campaign:no,company:r.company,team:r.team,position:r.position,duty:r.duty,q1:sc(),q2:sc(),q3:sc(),
          good:rnd()<.25?pick(['먼저 인사하니 다른 계열사 분들과 대화가 늘었습니다.','팀장님이 먼저 인사하셔서 자연스럽게 따라 하게 됐습니다.','짧은 인사가 회의 분위기를 바꾼다는 걸 느꼈습니다.']):'',
          hard:rnd()<.18?pick(['층이 달라 다른 계열사 분들을 만날 기회가 적었습니다.','바쁜 주에는 잊게 됩니다. 중간 리마인드가 있으면 좋겠습니다.']):''});
      }
    });
    for(let i=0;i<(no===1?9:4);i++){ const a=pick(roster), b=pick(roster); if(a!==b) db.recommends.push({ts:ts(addD(s.start,8)),campaign:no,...who(a),targetCompany:b.company,targetTeam:b.team,targetName:b.name,reason:pick(REASONS)}); }
    roster.filter(r=>r.leader==='Y'&&r!==lead).forEach(l=>{ if(rnd()<(no===1?.95:.8)) db.openings.push({ts:ts(s.stages[1].from),campaign:no,company:l.company,team:l.team,leader:l.name,plan:'매일 아침 스탠드업 전 1분, 이번 주 실천 사례를 한 명씩 나눕니다.',promise:'회의 마지막 1분 질문 고정',cycle:'매주',due:fmt(s.fri4)}); });
  });
  db.ops.push({campaign:1,stage:1,done:true,memo:''},{campaign:1,stage:2,done:true,memo:''},{campaign:1,stage:3,done:true,memo:''},{campaign:1,stage:4,done:true,memo:'C사 실천지수가 낮음. 층간 이동이 적은 사업장 특성 반영해 2번 캠페인은 팀 회의 안에서 실천하도록 안내.'},{campaign:2,stage:1,done:true,memo:''},{campaign:2,stage:2,done:true,memo:''});

  const out=v=>new Promise(r=>setTimeout(()=>r(JSON.parse(JSON.stringify(v))),160));
  const no_=x=>Promise.reject(x);
  const person=(co,emp)=>roster.find(r=>r.company===String(co).trim()&&r.empno===String(emp).trim());
  const acc=p=>db.accounts[p.company+'|'+p.empno];
  const ver=p=>{ const a=acc(p); return a&&a.pw ? 'v'+a.v : 'INIT'; };
  const profile=p=>{ const a=db.auth.find(x=>x.company===p.company&&x.empno===p.empno); let role='',sc='',st='';
    if(a&&a.role==='HQ') role='HQ'; else if(a&&a.role==='HR'){ role='HR'; sc=a.scopeCompany||p.company; } else if(p.leader==='Y'){ role='LEADER'; sc=p.company; st=p.team; }
    return {empno:p.empno,company:p.company,team:p.team,name:p.name,position:p.position,duty:p.duty,leader:p.leader,role,scopeCompany:sc,scopeTeam:st}; };
  const token=(p,must)=>'mock.'+[p.company,p.empno,ver(p),must?1:0].map(encodeURIComponent).join('.');
  function session(tk, allowMust){
    const f=String(tk||'').split('.'); if(f[0]!=='mock'||f.length!==5) throw apiError('로그인이 필요합니다','AUTH');
    const [co,emp,v,m]=f.slice(1).map(decodeURIComponent); const p=person(co,emp);
    if(!p) throw apiError('명단에서 찾을 수 없습니다','AUTH');
    if(ver(p)!==v) throw apiError('비밀번호가 바뀌어 다시 로그인해야 합니다','AUTH');
    if(m==='1'&&!allowMust) throw apiError('비밀번호를 먼저 변경하세요','MUST_CHANGE');
    return profile(p);
  }
  const scopeFn=a=>r=>a.role==='HQ'||(r.company===a.scopeCompany&&(a.role==='HR'||r.team===a.scopeTeam));
  const upsert=(arr,row,keys)=>{ const i=arr.findIndex(x=>keys.every(k=>String(x[k])===String(row[k]))); if(i>=0) arr[i]=row; else arr.push(row); };
  const H={
    login(b){
      const p=person(b.company,b.empno); if(!p) throw apiError('계열사와 사번을 확인하세요');
      let a=acc(p); if(a&&a.lockUntil>Date.now()) throw apiError(`비밀번호를 5회 잘못 입력해 잠겼습니다. ${Math.ceil((a.lockUntil-Date.now())/60000)}분 뒤 다시 시도하세요`);
      const must=!(a&&a.pw); const ok = must ? b.password===(p.initPw||p.empno) : b.password===a.pw;
      if(!ok){ a=db.accounts[p.company+'|'+p.empno]=a||{pw:'',v:0,fails:0,lockUntil:0}; a.fails++;
        if(a.fails>=5){ a.fails=0; a.lockUntil=Date.now()+600000; throw apiError('비밀번호를 5회 잘못 입력해 10분간 잠겼습니다'); }
        throw apiError(`비밀번호가 맞지 않습니다 (${a.fails}/5회)`); }
      if(a){ a.fails=0; a.lockUntil=0; }
      return {token:token(p,must),mustChange:must,profile:profile(p)};
    },
    changePassword(b){
      const me=session(b.token,true), p=person(me.company,me.empno), a=acc(p);
      const curOk = a&&a.pw ? b.current===a.pw : b.current===(p.initPw||p.empno);
      if(!curOk) throw apiError('현재 비밀번호가 맞지 않습니다');
      const nx=String(b.next||''); if(nx.length<8||!/[A-Za-z]/.test(nx)||!/[0-9]/.test(nx)) throw apiError('새 비밀번호는 영문과 숫자를 섞어 8자 이상이어야 합니다');
      if(nx===p.empno||nx===b.current) throw apiError('사번이나 이전 비밀번호와 다른 비밀번호를 쓰세요');
      db.accounts[p.company+'|'+p.empno]={pw:nx,v:((a&&a.v)||0)+1,fails:0,lockUntil:0};
      return {token:token(p,false),mustChange:false,profile:profile(p)};
    },
    me(b){ const me=session(b.token); const mine=r=>r.company===me.company&&r.empno===me.empno;
      return {profile:me,people:roster.filter(r=>!mine(r)).map(r=>({company:r.company,team:r.team,name:r.name})),
        practice:db.practice.filter(mine),submissions:db.submissions.filter(mine),recommends:db.recommends.filter(mine),surveyDone:db.surveyPart.filter(mine).map(r=>r.campaign)}; },
    gallery(b){ session(b.token); const no=Number(b.campaign);
      return {submissions:db.submissions.filter(s=>s.campaign===no&&s.public).map(({ts,company,team,name,fields,link})=>({ts,company,team,name,fields,link})),
        recommends:db.recommends.filter(s=>s.campaign===no).map(({ts,targetCompany,targetTeam,targetName,reason,company})=>({ts,targetCompany,targetTeam,targetName,reason,company}))}; },
    write(action,b){
      const me=session(b.token), no=Number(b.campaign), now=fmt(today())+' '+new Date().toTimeString().slice(0,5);
      const base={ts:now,campaign:no,company:me.company,team:me.team,empno:me.empno,name:me.name};
      if(action==='practice') upsert(db.practice,{...base,checks:b.checks,note:b.note||''},['campaign','company','empno']);
      else if(action==='submit') db.submissions.push({...base,fields:JSON.stringify(b.fields),link:b.link||'',public:!!b.public});
      else if(action==='recommend') db.recommends.push({...base,targetCompany:b.targetCompany,targetTeam:b.targetTeam,targetName:b.targetName,reason:b.reason});
      else if(action==='survey'){
        if(db.surveyPart.some(r=>r.campaign===no&&r.company===me.company&&r.empno===me.empno)) throw apiError('이미 이번 캠페인 Survey에 응답했습니다');
        db.surveyPart.push(base);
        db.surveyResp.push({ts:fmt(today()),campaign:no,company:me.company,team:me.team,position:b.position,duty:b.duty,q1:b.q1,q2:b.q2,q3:b.q3,good:b.good||'',hard:b.hard||''});
      } else if(action==='opening'){
        if(me.role!=='LEADER') throw apiError('팀 리더만 등록할 수 있습니다');
        upsert(db.openings,{ts:now,campaign:no,company:me.company,team:me.team,leader:me.name,plan:b.plan,promise:b.promise,cycle:b.cycle,due:b.due},['campaign','company','team']);
      }
      return {saved:true};
    },
    adminData(b){
      const a=session(b.token); if(!a.role) throw apiError('운영자 권한이 없습니다');
      const no=Number(b.campaign), f=scopeFn(a), byNo=r=>r.campaign===no&&f(r);
      let sr=db.surveyResp.filter(byNo); if(a.role==='LEADER'&&sr.length<MIN_N) sr=sr.map(r=>({...r,q2:null}));
      const rost=roster.filter(f);
      const annual=CAMPAIGNS.map(c=>{ const ppl=new Set([...db.practice,...db.submissions].filter(r=>r.campaign===c.no&&f(r)).map(r=>r.company+'|'+r.empno));
        const rr=db.surveyResp.filter(r=>r.campaign===c.no&&f(r));
        return {campaign:c.no,target:rost.length,participants:ppl.size,surveyN:rr.length,q1:avg(rr.map(r=>r.q1)),q2:(a.role==='LEADER'&&rr.length<MIN_N)?null:avg(rr.map(r=>r.q2)),q3:avg(rr.map(r=>r.q3))}; });
      return {role:a.role,company:a.scopeCompany,team:a.scopeTeam,settings:db.settings,roster:rost.map(({initPw,...r})=>r),
        practice:db.practice.filter(byNo),submissions:db.submissions.filter(byNo),recommends:db.recommends.filter(byNo),
        surveyPart:db.surveyPart.filter(byNo),surveyResp:sr,openings:db.openings.filter(byNo),ops:db.ops,annual};
    },
    saveSettings(b){ const a=session(b.token); if(a.role!=='HQ') throw apiError('인재경영실 권한이 필요합니다'); db.settings={startDate:b.startDate,skipWeeks:b.skipWeeks}; return {saved:true}; },
    opsUpdate(b){ const a=session(b.token); if(a.role!=='HQ') throw apiError('인재경영실 권한이 필요합니다'); upsert(db.ops,{campaign:b.campaign,stage:b.stage,done:!!b.done,memo:b.memo||''},['campaign','stage']); return {saved:true}; },
    resetPassword(b){ const a=session(b.token); const t=person(b.company||a.scopeCompany,b.empno);
      if(!t) throw apiError('해당 계열사 명단에 없는 사번입니다');
      if(!(a.role==='HQ'||(a.role==='HR'&&t.company===a.scopeCompany))) throw apiError('이 직원의 비밀번호를 초기화할 권한이 없습니다');
      delete db.accounts[t.company+'|'+t.empno]; return {name:t.name,company:t.company}; }
  };
  return {
    demoAccounts:{hq,hr,lead,fresh,pw:DEMO_PW},
    bootstrap(){ return out({settings:db.settings,companies:[...new Set(roster.map(r=>r.company))]}); },
    call(action,b){
      try{
        const fn = ['practice','submit','recommend','survey','opening'].includes(action) ? ()=>H.write(action,b) : H[action] ? ()=>H[action](b) : null;
        if(!fn) throw apiError('알 수 없는 요청입니다');
        return out(fn());
      }catch(e){ return no_(e); }
    }
  };
})();

const api = {
  bootstrap(){ return state.demo ? mock.bootstrap() : remoteApi.bootstrap(); },
  call(action, body={}){ const b={...body}; if(state.session) b.token=state.session.token; return state.demo ? mock.call(action,b) : remoteApi.call(action,b); }
};

const state = {

// 비밀번호 변경 전 임시 로그인은 저장하지 않습니다(새로고침하면 다시 로그인).
function setSession(s){
  state.session=s;
  const p=s&&s.profile;
  state.auth = p&&p.role ? {role:p.role, company:p.scopeCompany, team:p.scopeTeam} : null;
  if(s&&!s.mustChange) store.set('session',{token:s.token,profile:s.profile,mustChange:false}); else store.del('session');
  renderAcct();
}
function clearSession(){ state.session=null; state.auth=null; state.people=[]; state.adminNo=null; state.adminTab='run'; store.del('session'); renderAcct(); }
const prof = () => state.session && state.session.profile;
const peopleCos = () => [...new Set(state.people.map(r=>r.company))];
const peopleTeams = co => [...new Set(state.people.filter(r=>r.company===co).map(r=>r.team))];
const peopleIn = (co,tm) => state.people.filter(r=>r.company===co&&r.team===tm);
async function loadMe(){ const m=await api.call('me'); state.people=m.people; if(state.session){ state.session.profile=m.profile; setSession(state.session); } return m; }
function renderAcct(){
  const el=$('#acct'); if(!el) return; const p=prof();
  $('#navAdmin').hidden = !(p && p.role && !state.session.mustChange);
  el.innerHTML = p && !state.session.mustChange
    ? `<span class="acct-name">${esc(p.name)}<span class="cap"> · ${esc(p.company)}</span></span><button class="btn ghost sm" data-act="logout">로그아웃</button>`
    : `<a class="btn sm" href="#login">로그인</a>`;
}

function aggregate(d){
  const roster=d.roster; const teams={};
  roster.forEach(r=>{ const k=r.company+'|'+r.team; (teams[k]=teams[k]||{company:r.company,team:r.team,target:0,leader:''}).target++; if(r.leader==='Y') teams[k].leader=r.name; });
  const part=new Set([...d.practice,...d.submissions].map(r=>key(r.company,r.team,r.empno||r.name)));
  const by=(fn)=>{ const m={}; Object.values(teams).forEach(t=>{ const k=fn(t); const x=m[k]=m[k]||{label:k,target:0,part:0,subs:0,recs:0,svN:0,q1:[],q2:[],q3:[],teams:0,opened:0}; x.target+=t.target; x.teams++; }); return m; };
  const byCo=by(t=>t.company), byTeam=by(t=>t.company+' · '+t.team);
  const add=(m,k,f)=>{ if(m[k]) f(m[k]); };
  part.forEach(p=>{ const [co,tm]=p.split('|'); add(byCo,co,x=>x.part++); add(byTeam,co+' · '+tm,x=>x.part++); });
  d.submissions.forEach(s=>{ add(byCo,s.company,x=>x.subs++); add(byTeam,s.company+' · '+s.team,x=>x.subs++); });
  d.recommends.forEach(s=>{ add(byCo,s.company,x=>x.recs++); add(byTeam,s.company+' · '+s.team,x=>x.recs++); });
  d.surveyResp.forEach(s=>{ [byCo[s.company],byTeam[s.company+' · '+s.team]].forEach(x=>{ if(!x) return; x.svN++; x.q1.push(s.q1); if(s.q2!=null) x.q2.push(s.q2); x.q3.push(s.q3); }); });
  const openedTeams=new Set(d.openings.map(o=>o.company+' · '+o.team));
  Object.values(byTeam).forEach(x=>{ x.opened=openedTeams.has(x.label)?1:0; });
  Object.values(byCo).forEach(x=>{ x.opened=Object.values(byTeam).filter(t=>t.label.startsWith(x.label+' · ')&&t.opened).length; });
  const target=roster.length;
  const sv=d.surveyResp;
  return {target, part:part.size, subs:d.submissions.length, recs:d.recommends.length, svN:d.surveyPart.length,
    q1:avg(sv.map(s=>s.q1)), q2:avg(sv.filter(s=>s.q2!=null).map(s=>s.q2)), q2n:sv.filter(s=>s.q2!=null).length, q3:avg(sv.map(s=>s.q3)),
    teams:Object.values(byTeam).map(t=>{ const tt=teams[t.label.replace(' · ','|')]||{}; return {...t,leader:tt.leader}; }), cos:Object.values(byCo), teamCount:Object.keys(teams).length, opened:openedTeams.size,
    good:sv.filter(s=>s.good).map(s=>({t:s.good,co:s.company})), hard:sv.filter(s=>s.hard).map(s=>({t:s.hard,co:s.company}))};
}

  let panel='';
  if(stage===1) panel=panelStory(c,s);

  const hqBar = state.auth.role==='HQ' ? `<div class="row between well"><span class="muted">${stage}단계 「${esc(STAGES[stage-1].title)}」 진행을 마쳤으면 완료로 표시하세요.</span><button class="btn sm ${opDone?'line':''}" data-act="opsDone" data-k="${stage}" data-done="${opDone?'0':'1'}">${opDone?'완료 취소':'완료로 표시'}</button></div>`:'';

    <div class="row between"><span class="status" id="stStatus" role="status"></span><button class="btn" type="submit">일정 저장</button></div>
  </form>`;
}

/* ===================== 라우터 ===================== */
const ROUTES={home:viewHome,campaigns:viewCampaigns,join:viewJoin,survey:viewSurvey,cases:viewCases,guide:viewGuide,admin:viewAdmin,login:()=>gate()||viewHome()};
async function render(focus){
  const h=(location.hash||'#home').slice(1); const main=$('#main');
  let route=h, fn;
  if(/^c\d{2}$/.test(h)){ route='campaigns'; fn=()=>viewCampaign(Number(h.slice(1))); } else fn=ROUTES[h]||viewHome;
  $$('.nav a').forEach(a=>{ if(a.dataset.nav===(ROUTES[route]?route:'home')) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  main.setAttribute('aria-busy','true');
  const v = state._rv = (state._rv||0)+1;   // 늦게 도착한 이전 화면 결과는 버립니다
  try{ const html = await fn(); if(v!==state._rv) return; main.innerHTML = html; }
  catch(e){
    if(v!==state._rv) return;
    if(e.code==='AUTH'){ clearSession(); state._loginMsg=e.message; main.innerHTML=viewLogin(); main.setAttribute('aria-busy','false'); return; }
    if(e.code==='MUST_CHANGE'&&state.session){ state.session.mustChange=true; main.innerHTML=viewChangePw(); main.setAttribute('aria-busy','false'); return; }
    main.innerHTML = emptyBox('불러오지 못했습니다', e.message||'잠시 후 다시 시도하세요.', '<button class="btn" data-act="reload">다시 시도</button>'); }
  main.setAttribute('aria-busy','false');
  if(focus){ window.scrollTo(0,0); main.focus({preventScroll:true}); }
}
window.addEventListener('hashchange',()=>{ state.adminStage=null; render(true); });

/* ===================== 이벤트 ===================== */
const ACTIONS={
  reload(){ render(); },
  theme(){ const order=['auto','light','dark']; const cur=store.get('theme')||'auto'; applyTheme(order[(order.indexOf(cur)+1)%3]); },
  copy(b){ const ta=document.getElementById(b.dataset.target); copyText(ta.value, ta); },
  logout(){ clearSession(); state._curPw=null; toast('로그아웃했습니다'); render(true); },
  adminTab(b){ state.adminTab=b.dataset.k; render(); },
  adminStage(b){ state.adminStage=Number(b.dataset.k); render(); },
  async opsDone(b){
    const k=Number(b.dataset.k), done=b.dataset.done==='1';
    const memo=((state.adminData.ops||[]).find(o=>Number(o.campaign)===state.adminNo&&Number(o.stage)===k)||{}).memo||'';
    b.disabled=true;
    try{ await api.call('opsUpdate',{campaign:state.adminNo,stage:k,done,memo}); toast(done?'완료로 표시했습니다':'완료 표시를 취소했습니다'); render(); }
    catch(e){ toast(e.message); b.disabled=false; }
  },
  async saveCard(b){
    const el=$('#storycard');
    if(!window.html2canvas){ toast('이미지 저장 기능을 불러오지 못했습니다. 카드를 화면 캡처해 사용하세요'); return; }
    b.disabled=true;
    try{ const cv=await html2canvas(el,{scale:2,backgroundColor:'#FAFAF9'}); const a=document.createElement('a'); a.href=cv.toDataURL('image/png'); a.download=`WinningBasic_${two(b.dataset.no)}_스토리카드.png`; document.body.appendChild(a); a.click(); a.remove(); toast('카드 이미지를 저장했습니다'); }
    catch(e){ toast('이미지를 만들지 못했습니다. 카드를 화면 캡처해 사용하세요'); }
    b.disabled=false;
  },
  addSkip(){ const v=$('#stSkip').value; if(!v){ toast('건너뛸 주의 날짜를 먼저 고르세요'); $('#stSkip').focus(); return; } let x=D(v); while(x.getDay()!==1) x=addD(x,-1); const k=fmt(x); if(!state._skips.includes(k)) state._skips.push(k); state._skips.sort(); render(); },
  delSkip(b){ state._skips.splice(Number(b.dataset.i),1); render(); }
};
const CHANGES={
  recCo(e){ state._recCo=e.target.value; state._recTm=''; rerenderKeep(); },
  recTm(e){ state._recTm=e.target.value; rerenderKeep(); },
  galleryNo(e){ state.galleryNo=Number(e.target.value); render(); },
  galleryCo(e){ state.galleryCo=e.target.value; render(); },
  adminNo(e){ state.adminNo=Number(e.target.value); state.adminStage=null; render(); },
  stStart(e){ state._start=e.target.value; render(); }
};
async function rerenderKeep(){ // 다른 폼 입력값 유지
  const keep={}; $$('#main input,#main textarea').forEach(el=>{ if(el.id) keep[el.id]= el.type==='checkbox'?el.checked:el.value; });
  await render(); Object.entries(keep).forEach(([id,v])=>{ const el=document.getElementById(id); if(!el) return; if(el.type==='checkbox') el.checked=v; else if(!el.readOnly) el.value=v; });
}
const FORMS={
  async practice(f){
    const c=activeCampaign(); const checks=$$('input[name=ck]:checked',f).map(x=>x.value);
    const st=$('#pStatus');
    if(!checks.length){ st.className='status bad'; st.textContent='실천한 행동을 1개 이상 체크하세요'; return; }
    st.className='status'; st.textContent='저장하는 중…';
    try{ await api.call('practice',{campaign:c.no,checks:checks.join(','),note:f.elements.note.value.trim()}); st.className='status ok'; st.textContent='저장했습니다'; }
    catch(e){ st.className='status bad'; st.textContent=e.message; }
  },
  async submit(f){
    const c=activeCampaign(); let ok=true;
    c.submit.forEach((l,i)=>{ ok = setErr(f,'f'+i, f.elements['f'+i].value.trim()?'':'내용을 적어 주세요') && ok; });
    const link=f.elements.link.value.trim();
    ok = setErr(f,'link', link && !/^https?:\/\/\S+$/.test(link) ? 'https:// 로 시작하는 주소를 넣어 주세요':'') && ok;
    if(!ok){ f.querySelector('[aria-invalid="true"]').focus(); return; }
    const fields={}; c.submit.forEach((l,i)=>fields[l]=f.elements['f'+i].value.trim());
    const st=$('#sStatus'); st.className='status'; st.textContent='제출하는 중…';
    try{ await api.call('submit',{campaign:c.no,fields,link,public:f.elements.pub.checked}); toast('결과물을 제출했습니다'); render(); }
    catch(e){ st.className='status bad'; st.textContent=e.message; }
  },
  async recommend(f){
    const c=activeCampaign(); let ok=setErr(f,'tNm', f.elements.tNm.value?'':'추천할 동료를 선택하세요');
    ok = setErr(f,'reason', f.elements.reason.value.trim().length>=10?'':'추천 이유를 10자 이상 적어 주세요') && ok;
    if(!ok){ f.querySelector('[aria-invalid="true"]').focus(); return; }
    const st=$('#rStatus'); st.className='status'; st.textContent='보내는 중…';
    try{ await api.call('recommend',{campaign:c.no,targetCompany:f.elements.tCo.value,targetTeam:f.elements.tTm.value,targetName:f.elements.tNm.value,reason:f.elements.reason.value.trim()});
      f.elements.reason.value=''; f.elements.tNm.value=''; st.className='status ok'; st.textContent='추천을 보냈습니다. 고맙습니다'; }
    catch(e){ st.className='status bad'; st.textContent=e.message; }
  },
  async survey(f){
    let ok=true; ['q1','q2','q3'].forEach(q=>{ ok = setErr(f,q, f.querySelector(`input[name=${q}]:checked`)?'':'1~5 중 하나를 고르세요') && ok; });
    if(!ok){ const first=f.querySelector('[aria-invalid="true"]'); first&&first.focus(); return; }
    const yes=await confirmDlg('Survey를 제출할까요?','제출한 응답은 수정할 수 없습니다.','제출');
    if(!yes) return;
    const v=q=>Number(f.querySelector(`input[name=${q}]:checked`).value);
    const st=$('#svStatus'); st.className='status'; st.textContent='제출하는 중…';
    try{ await api.call('survey',{campaign:Number(f.dataset.no),position:f.elements.position.value,duty:f.elements.duty.value,q1:v('q1'),q2:v('q2'),q3:v('q3'),good:f.elements.good.value.trim(),hard:f.elements.hard.value.trim()}); toast('응답을 제출했습니다'); render(true); }
    catch(e){ st.className='status bad'; st.textContent=e.message; }
  },
  async login(f){
    let ok=setErr(f,'company', f.elements.company.value?'':'회사를 선택하세요');
    ok=setErr(f,'empno', f.elements.empno.value.trim()?'':'사번을 입력하세요')&&ok;
    ok=setErr(f,'pw', f.elements.pw.value?'':'비밀번호를 입력하세요')&&ok;
    if(!ok){ f.querySelector('[aria-invalid="true"]').focus(); return; }
    const btn=f.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='확인하는 중…';
    try{
      const r=await api.call('login',{company:f.elements.company.value,empno:f.elements.empno.value.trim(),password:f.elements.pw.value});
      state._lastCo=f.elements.company.value; store.set('lastCo',state._lastCo);
      state._curPw = r.mustChange ? f.elements.pw.value : null;
      setSession(r); if(!r.mustChange) toast(`${r.profile.name}님, 반갑습니다`); render(true);
    }catch(e){ setErr(f,'pw', e.message); f.elements.pw.value=''; f.elements.pw.focus(); btn.disabled=false; btn.textContent='로그인'; }
  },
  async changePw(f){
    const cur = state._curPw || (f.elements.current&&f.elements.current.value) || '';
    const nx=f.elements.next.value, nx2=f.elements.next2.value, emp=prof().empno;
    let ok=true;
    if(f.elements.current) ok=setErr(f,'current', cur?'':'현재 비밀번호를 입력하세요')&&ok;
    ok=setErr(f,'next', nx.length<8||!/[A-Za-z]/.test(nx)||!/[0-9]/.test(nx)?'영문과 숫자를 섞어 8자 이상으로 정하세요': nx===emp||nx===cur?'사번이나 초기 비밀번호와 다르게 정하세요':'')&&ok;
    ok=setErr(f,'next2', nx2&&nx2===nx?'':'새 비밀번호가 서로 다릅니다')&&ok;
    if(!ok){ f.querySelector('[aria-invalid="true"]').focus(); return; }
    const btn=f.querySelector('button[type=submit]'); btn.disabled=true; btn.textContent='저장하는 중…';
    try{ const r=await api.call('changePassword',{current:cur,next:nx}); state._curPw=null; setSession(r); toast('비밀번호를 바꿨습니다'); render(true); }
    catch(e){ setErr(f, f.elements.current&&/현재/.test(e.message)?'current':'next', e.message); btn.disabled=false; btn.textContent='비밀번호 변경'; }
  },
  async resetPw(f){
    const emp=f.elements.empno.value.trim(); if(!setErr(f,'empno', emp?'':'사번을 입력하세요')){ f.elements.empno.focus(); return; }
    const co=f.elements.company.value;
    const yes=await confirmDlg('비밀번호를 초기화할까요?',`${co} 사번 ${emp} 직원의 비밀번호가 초기 비밀번호로 돌아갑니다. 지금 로그인된 기기에서도 로그아웃됩니다.`,'초기화');
    if(!yes) return;
    const st=$('#rpStatus'); st.className='status'; st.textContent='처리하는 중…';
    try{ const r=await api.call('resetPassword',{company:co,empno:emp}); st.className='status ok'; st.textContent=`${r.company} ${r.name}님의 비밀번호를 초기화했습니다`; f.elements.empno.value=''; }
    catch(e){ st.className='status bad'; st.textContent=e.message; }
  },
  async opening(f){
    let ok=true; [['plan','팀 운영 방향을 적어 주세요'],['promise','팀 약속을 적어 주세요'],['cycle','주기를 고르세요'],['due','기한을 정하세요']].forEach(([n,m])=>{ ok = setErr(f,n, f.elements[n].value.trim()?'':m) && ok; });
    if(!ok){ f.querySelector('[aria-invalid="true"]').focus(); return; }
    const st=$('#opStatus'); st.className='status'; st.textContent='저장하는 중…';
    try{ await api.call('opening',{campaign:state.adminNo,plan:f.elements.plan.value.trim(),promise:f.elements.promise.value.trim(),cycle:f.elements.cycle.value,due:f.elements.due.value}); toast('팀 운영 방향을 저장했습니다'); render(); }
    catch(e){ st.className='status bad'; st.textContent=e.message; }
  },
  async memo(f){
    const st=$('#mmStatus'); st.className='status'; st.textContent='저장하는 중…';
    const op=(state.adminData.ops||[]).find(o=>Number(o.campaign)===state.adminNo&&Number(o.stage)===4);
    try{ await api.call('opsUpdate',{campaign:state.adminNo,stage:4,done:op?(op.done===true||op.done==='TRUE'||op.done==='true'):false,memo:f.elements.memo.value.trim()}); st.className='status ok'; st.textContent='저장했습니다'; }
    catch(e){ st.className='status bad'; st.textContent=e.message; }
  },
  async settings(f){
    const start=f.elements.startDate.value;
    if(!setErr(f,'startDate', start?'':'시작일을 정하세요')){ f.elements.startDate.focus(); return; }
    let x=D(start); while(x.getDay()!==1) x=addD(x,1);
    const yes=await confirmDlg('일정을 저장할까요?','저장하면 모든 구성원 화면의 캠페인 기간과 진행 단계가 바로 바뀝니다.','저장');
    if(!yes) return;
    const st=$('#stStatus'); st.className='status'; st.textContent='저장하는 중…';
    try{ await api.call('saveSettings',{startDate:fmt(x),skipWeeks:state._skips});
      state.settings={startDate:fmt(x),skipWeeks:[...state._skips]}; state.schedule=buildSchedule(state.settings.startDate,state.settings.skipWeeks); state._start=null; toast('일정을 저장했습니다'); render(); }
    catch(e){ st.className='status bad'; st.textContent=e.message; }
  }
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(b&&ACTIONS[b.dataset.act]){ e.preventDefault(); ACTIONS[b.dataset.act](b,e); } });
document.addEventListener('change',e=>{ const k=e.target.dataset&&e.target.dataset.change; if(k&&CHANGES[k]) CHANGES[k](e); });
document.addEventListener('submit',e=>{ const f=e.target; if(f.dataset.form&&FORMS[f.dataset.form]){ e.preventDefault(); FORMS[f.dataset.form](f); } });

function demoBar(){
  const bar=$('#demoBar'); if(!state.demo){ bar.hidden=true; return; }
  bar.hidden=false;
  bar.innerHTML=`<div class="wrap"><span><strong>데모 모드</strong> · 예시 데이터로 동작합니다. 입력한 내용은 새로고침하면 사라집니다.</span><label for="demoDay">기준일 바꿔보기 <input type="date" id="demoDay" value="${fmt(today())}"></label></div>`;
  $('#demoDay').addEventListener('change',e=>{ state.demoToday=e.target.value||null; state.adminNo=null; state.adminStage=null; render(); });
}
const THEME_UI={
  auto:{label:'자동',icon:'<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg>'},
  light:{label:'라이트',icon:'<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3" fill="currentColor"/><g stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.05 3.05l1.13 1.13M11.82 11.82l1.13 1.13M3.05 12.95l1.13-1.13M11.82 4.18l1.13-1.13"/></g></svg>'},
  dark:{label:'다크',icon:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.75 5.75 0 0 1 6.4 2.5a5.75 5.75 0 1 0 7.1 7.1z" fill="currentColor"/></svg>'}
};
function applyTheme(t){
  if(!THEME_UI[t]) t='auto';
  const root=document.documentElement;
  if(t==='auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme',t);
  if(t==='auto') store.del('theme'); else store.set('theme',t);
  const b=$('#themeBtn'); const next={auto:'라이트',light:'다크',dark:'자동'}[t];
  b.innerHTML=THEME_UI[t].icon+`<span class="t-label">${THEME_UI[t].label}</span>`;
  b.setAttribute('aria-label',`화면 모드: ${THEME_UI[t].label}. 누르면 ${next} 모드로 바뀝니다`);
  b.title=`화면 모드: ${THEME_UI[t].label} (누르면 ${next})`;
}
applyTheme(store.get('theme')||'auto');
(async function init(){
  $('#main').innerHTML='<div class="stack"><div class="skel"></div><div class="grid g2"><div class="skel"></div><div class="skel"></div></div></div>';
  try{
    const b=await api.bootstrap();
    state.settings=b.settings; state.companies=b.companies||[];
    state.schedule=buildSchedule(b.settings.startDate, b.settings.skipWeeks);
    state._lastCo=store.get('lastCo')||'';
    const saved=store.get('session'); if(saved&&saved.token) setSession(saved); else renderAcct();
  }catch(e){
    $('#main').innerHTML=emptyBox('서버에 연결하지 못했습니다','앱 주소 설정(API_URL)이나 네트워크를 확인한 뒤 다시 시도하세요. ('+e.message+')','<button class="btn" onclick="location.reload()">다시 시도</button>');
    $('#main').setAttribute('aria-busy','false'); return;
  }
  demoBar(); render();
})();
